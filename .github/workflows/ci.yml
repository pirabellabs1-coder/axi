name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeurs factices : aucune connexion réelle n'est ouverte pendant typecheck / lint / test / build.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/axi_ci?schema=public"
  APP_SECRET: "ci-secret-ci-secret-ci-secret-ci-secret-0000"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  NEXT_PUBLIC_APP_DOMAIN: "localhost:3000"
  EMAIL_PROVIDER: "console"
  JOBS_RUN_KEY: "ci-jobs-key"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
